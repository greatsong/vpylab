<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/x-icon" sizes="16x16 32x32 48x48" href="/favicon.ico" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="빛과 소리로 시작하는 코딩. 작은 코드를 실행하고 한 가지씩 바꾸며, 나에게 필요한 작품을 만들고 공유합니다." />
    <title>VPyLab — 빛과 소리로 시작하는 코딩</title>
    <!-- PWA 설치 -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="VPyLab" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- 공유 미리보기 기본 카드. /s/:id, /gallery/:id는 api/og.js가 작품 정보로 바꿉니다. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="VPyLab" />
    <meta property="og:title" content="VPyLab — 빛과 소리로 시작하는 코딩" />
    <meta property="og:description" content="작은 코드를 실행하고, 한 가지씩 바꾸고, 달라진 이유를 찾아보세요. 기초 교재부터 작품 저장과 공유까지 이어갑니다." />
    <meta property="og:image" content="https://vpylab.vercel.app/brand/og-default.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Pyodide는 실행 시 Worker가 로드합니다. CDN preload는 학교망/QUIC 장애 때 콘솔 오류를 앞당기므로 연결만 예열합니다. -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link rel="preconnect" href="https://unpkg.com" crossorigin>
    <link rel="dns-prefetch" href="//cdn.jsdelivr.net">
    <link rel="dns-prefetch" href="//unpkg.com">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
