<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VPyLab 안내 가이드 · 주요 장면</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f8fc;color:#182135;font-family:system-ui,-apple-system,"Apple SD Gothic Neo",sans-serif;line-height:1.65}header{max-width:1440px;margin:auto;padding:46px 28px 25px}h1{margin:0 0 12px;font-size:32px}header p{max-width:900px;color:#5c6575}nav{display:flex;gap:12px;flex-wrap:wrap}nav a,.download{color:#315ff4;text-decoration:none;font-weight:650}nav a{background:white;border:1px solid #dce3ef;padding:9px 16px}.note{padding:16px;border-left:3px solid #315ff4;background:#edf2ff}main{max-width:1440px;margin:auto;padding:0 28px 45px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}figure{background:white;border:1px solid #dfe4ee;padding:16px;margin:0}figcaption{display:flex;justify-content:space-between;gap:12px;margin-bottom:14px}figcaption span{color:#315ff4;font-size:13px;white-space:nowrap}img{width:100%;height:auto;border:1px solid #e5e8ef;display:block}figure p{color:#5c6575;font-size:14px}a:focus-visible{outline:3px solid #315ff4}@media(max-width:860px){main{grid-template-columns:1fr}h1{font-size:26px}}@media print{main{display:block}figure{break-inside:avoid;margin-bottom:20px}nav,.download{display:none}}</style><header><h1>VPyLab · 안내 가이드 주요 장면</h1><p>입장, 수업 자료, 문제 정의, Python·3D·소리, 동료 검토, GitHub 기록, 교사와 학생의 피드백 화면 15장입니다. 이미지를 누르면 2880×2200 PNG 원본을 볼 수 있습니다.</p><nav><a href="vpylab-guide-captures.zip" download>전체 PNG·캡션 받기 ↓</a><a href="contact-sheet.png">전체 미리보기</a><a href="README.md">장면별 권장 캡션</a></nav><p class="note">안내용 합성 자료를 사용한 로컬 복사본입니다. 실제 GitHub 시험 근거와 안내용 질문·교실 안 검토·교사 피드백을 구분했으며, 촬영 중 운영 서비스나 외부 GitHub는 변경하지 않았습니다.</p></header><main><figure id="scene-00"><figcaption><b>00 · 교실에 들어가기</b><span>입장 전</span></figcaption><a href="00-welcome.png" target="_blank"><img src="00-welcome.png" alt="교실에 들어가기" loading="lazy" width="2880" height="2200"></a><p>로컬 안내용 역할 선택 화면입니다. 실제 GitHub OAuth 로그인 화면과 구분합니다.</p><a class="download" href="00-welcome.png" download>PNG 원본 받기 ↗</a></figure><figure id="scene-01"><figcaption><b>01 · 프로젝트와 팀 참여</b><span>학생 가</span></figcaption><a href="01-project-home.png" target="_blank"><img src="01-project-home.png" alt="프로젝트와 팀 참여" loading="lazy" width="2880" height="2200"></a><p>내 프로젝트를 열거나 초대 코드로 팀에 참여합니다.</p><a class="download" href="01-project-home.png" download>PNG 원본 받기 ↗</a></figure><figure id="scene-02"><figcaption><b>02 · 문제와 수업 방식 정하기</b><span>학생 가</span></figcaption><a href="02-new-project-policy.png" target="_blank"><img src="02-new-project-policy.png" alt="문제와 수업 방식 정하기" loading="lazy" width="2880" height="2200"></a><p>AI 선택 사용과 AI 미사용 수업 중 수업 방식을 선택할 수 있습니다. 프로젝트는 제출하지 않았습니다.</p><a class="download" href="02-new-project-policy.png" download>PNG 원본 받기 ↗</a></figure><figure id="scene-03"><figcaption><b>03 · 수업 자료에서 출발하기</b><span>학생 가</span></figcaption><a href="03-course-materials.png" target="_blank"><img src="03-course-materials.png" alt="수업 자료에서 출발하기" loading="lazy" width="2880" height="2200"></a><p>기존 코스·차시·미션·예제를 살려 새로운 프로젝트의 재료로 사용합니다.</p><a class="download" href="03-course-materials.png" download>PNG 원본 받기 ↗</a></figure><figure id="scene-04"><figcaption><b>04 · 문제를 정의하고 질문 남기기</b><span>학생 가</span></figcaption><a href="04-problem-and-question.png" target="_blank"><img src="04-problem-and-question.png" alt="문제를 정의하고 질문 남기기" loading="lazy" width="2880" height="2200"></a><p>성공 기준과 AI 미사용 정책을 확인하고 팀의 질문을 기록합니다. 질문은 안내용 복사본의 합성 자료입니다.</p><a class="download" href="04-problem-and-question.png" download>PNG 원본 받기 ↗</a></figure><figure id="scene-05"><figcaption><b>05 · Python·3D·소리를 함께 실험하기</b><span>학생 가</span></figcaption><a href="05-python-3d-sound.png" target="_blank"><img src="05-python-3d-sound.png" alt="Python·3D·소리를 함께 실험하기" loading="lazy" width="2880" height="2200"></a><p>개인 초안에서 두 반지름을 비교하는 코드가 실제로 실행된 화면입니다. 소리 조절 UI를 포함하며 정지 이미지는 음질 검증을 뜻하지 않습니다.</p><a class="download" href="05-python-3d-sound.png" download>PNG 원본 받기 ↗</a></figure><figure id="scene-06"><figcaption><b>06 · 변경 이유와 실험 근거 남기기</b><span>학생 가</span></figcaption><a href="06-proposal-evidence.png" target="_blank"><img src="06-proposal-evidence.png" alt="변경 이유와 실험 근거 남기기" loading="lazy" width="2880" height="2200"></a><p>가설·관찰·판단·다음 실험을 적는 교실 안 변경 제안입니다. 모달은 촬영 뒤 취소했습니다.</p><a class="download" href="06-proposal-evidence.png" download>PNG 원본 받기 ↗</a></figure><figure id="scene-07"><figcaption><b>07 · 교실 안에서 동료와 검토하기</b><span>학생 가</span></figcaption><a href="07-local-peer-review.png" target="_blank"><img src="07-local-peer-review.png" alt="교실 안에서 동료와 검토하기" loading="lazy" width="2880" height="2200"></a><p>복사본의 합성 로컬 제안·승인입니다. 화면 안내처럼 GitHub PR 리뷰와 별도입니다.</p><a class="download" href="07-local-peer-review.png" download>PNG 원본 받기 ↗</a></figure><figure id="scene-08"><figcaption><b>08 · GitHub 저장소와 PR 상태 확인하기</b><span>학생 가</span></figcaption><a href="08-github-team-connection.png" target="_blank"><img src="08-github-team-connection.png" alt="GitHub 저장소와 PR 상태 확인하기" loading="lazy" width="2880" height="2200"></a><p>실제 시험 저장소와 완료된 PR #3의 원문 링크입니다. 외부 전송·동기화 버튼은 누르지 않았습니다.</p><a class="download" href="08-github-team-connection.png" download>PNG 원본 받기 ↗</a></figure><figure id="scene-09"><figcaption><b>09 · 실제 GitHub 협력을 학생별로 살펴보기</b><span>선생님</span></figcaption><a href="09-teacher-github-process.png" target="_blank"><img src="09-teacher-github-process.png" alt="실제 GitHub 협력을 학생별로 살펴보기" loading="lazy" width="2880" height="2200"></a><p>실제 두 계정 시험의 PR·검토 의견·승인과 학생 나의 검증된 숫자 계정 연결을 표시합니다.</p><a class="download" href="09-teacher-github-process.png" download>PNG 원본 받기 ↗</a></figure><figure id="scene-10"><figcaption><b>10 · 근거를 연결해 교사 개인 기록 작성하기</b><span>선생님</span></figcaption><a href="10-teacher-private-note.png" target="_blank"><img src="10-teacher-private-note.png" alt="근거를 연결해 교사 개인 기록 작성하기" loading="lazy" width="2880" height="2200"></a><p>기본 비공개와 근거 선택을 보여줍니다. 작성 중 문장은 복사본의 임시 메모이며 저장·전달하지 않았습니다.</p><a class="download" href="10-teacher-private-note.png" download>PNG 원본 받기 ↗</a></figure><figure id="scene-11"><figcaption><b>11 · 작성자의 과정과 전달된 피드백</b><span>학생 가</span></figcaption><a href="11-student-a-feedback.png" target="_blank"><img src="11-student-a-feedback.png" alt="작성자의 과정과 전달된 피드백" loading="lazy" width="2880" height="2200"></a><p>학생 가의 PR 근거와 개인·팀 피드백입니다. 교사 개인 기록과 학생 나의 개별 피드백은 표시하지 않습니다.</p><a class="download" href="11-student-a-feedback.png" download>PNG 원본 받기 ↗</a></figure><figure id="scene-12"><figcaption><b>12 · 검토자의 리뷰와 다음 질문</b><span>학생 나</span></figcaption><a href="12-student-b-review-feedback.png" target="_blank"><img src="12-student-b-review-feedback.png" alt="검토자의 리뷰와 다음 질문" loading="lazy" width="2880" height="2200"></a><p>학생 나의 실제 검토 의견·승인 기록과 전달된 피드백입니다. 작성자와 검토자의 과정이 각각 연결됩니다.</p><a class="download" href="12-student-b-review-feedback.png" download>PNG 원본 받기 ↗</a></figure><figure id="scene-13"><figcaption><b>13 · 실험의 발자국과 복구</b><span>학생 나</span></figcaption><a href="13-journal-and-recovery.png" target="_blank"><img src="13-journal-and-recovery.png" alt="실험의 발자국과 복구" loading="lazy" width="2880" height="2200"></a><p>확정 버전의 실험 근거를 돌아보고 필요하면 개인 초안으로 복원합니다. 복원·내보내기는 실행하지 않았습니다.</p><a class="download" href="13-journal-and-recovery.png" download>PNG 원본 받기 ↗</a></figure><figure id="scene-14"><figcaption><b>14 · 교사 관찰실에서 과정 살펴보기</b><span>선생님</span></figcaption><a href="14-teacher-observation.png" target="_blank"><img src="14-teacher-observation.png" alt="교사 관찰실에서 과정 살펴보기" loading="lazy" width="2880" height="2200"></a><p>저장 횟수보다 문제·가설·수정·동료 의견·다음 실험을 관찰합니다.</p><a class="download" href="14-teacher-observation.png" download>PNG 원본 받기 ↗</a></figure></main></html>
